name: Product installation and contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,workbench]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - name: Cross-platform product contracts
        run: python -m pytest -q tests/test_core.py tests/test_finance.py tests/test_protocols.py tests/test_product_reports.py tests/test_typed_readiness_dcf.py tests/test_workbench_views.py
      - name: Full regression on Unix
        if: runner.os != 'Windows'
        run: python -m pytest -q
      - run: python -m build --wheel
      - name: Install built wheel
        shell: python
        run: |
          import glob, subprocess, sys
          wheel = glob.glob('dist/margin_research-*.whl')[0]
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheel], check=True)
      - run: python scripts/check_installed_product.py --expected-version 0.10.0
