name: Product installation and contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,workbench,release]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - name: Cross-platform product contracts
        run: python -m pytest -q tests/test_network_guard.py tests/test_core.py tests/test_finance.py tests/test_protocols.py tests/test_product_reports.py tests/test_typed_readiness_dcf.py tests/test_workbench_views.py tests/test_distributions.py tests/test_local_config.py
      - name: Full regression on Unix
        if: runner.os != 'Windows'
        run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distributions.py --version 0.10.1
      - run: python scripts/check_release_install.py --version 0.10.1
