name: PyPI release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to build and check
        required: true
        default: '0.10.1'
        type: string
      publish:
        description: Publish validated artifacts to the PyPI environment
        default: false
        type: boolean
      testpypi:
        description: Rehearse on TestPyPI before publishing (requires a separate account)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install ".[dev,workbench,release]"
      - name: Check the requested public version
        shell: python
        run: |
          import os
          from packaging.version import Version
          import margin
          requested = os.environ['RELEASE_VERSION']
          assert requested == margin.__version__
          assert Version(requested).local is None
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Inspect archives and record hashes
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'scripts/check_distributions.py', '--version', os.environ['RELEASE_VERSION'], '--output', 'artifact-check.json'], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-check
          path: artifact-check.json

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Fresh wheel, source and optional-extra installations
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'scripts/check_release_install.py', '--version', os.environ['RELEASE_VERSION'], '--output', 'install-check.json'], check=True)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-${{ matrix.os }}
          path: install-check.json

  testpypi:
    if: inputs.publish && inputs.testpypi && github.ref == 'refs/heads/main'
    needs: [build, install]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/margin-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  staging-install:
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Install dependencies from PyPI and the exact wheel from TestPyPI
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, tempfile, urllib.request, venv
          version = os.environ['RELEASE_VERSION']
          expected = pathlib.Path(f'dist/margin_mcp-{version}-py3-none-any.whl').resolve()
          smoke = pathlib.Path('scripts/check_installed_product.py').resolve()
          with urllib.request.urlopen(f'https://test.pypi.org/pypi/margin-mcp/{version}/json', timeout=30) as response:
              published = json.load(response)
          for artifact in pathlib.Path('dist').iterdir():
              record = next(item for item in published['urls'] if item['filename'] == artifact.name)
              assert record['digests']['sha256'] == hashlib.sha256(artifact.read_bytes()).hexdigest()
          with tempfile.TemporaryDirectory() as temp:
              root = pathlib.Path(temp)
              venv.EnvBuilder(with_pip=True).create(root / 'venv')
              python = root / 'venv/bin/python'
              def run(*args):
                  subprocess.run([str(python), '-m', 'pip', '--isolated', *map(str, args)], check=True, cwd=root)
              run('install', '--index-url', 'https://pypi.org/simple', str(expected) + '[workbench]')
              run('uninstall', '-y', 'margin-mcp')
              downloaded = root / 'download'
              run('download', '--index-url', 'https://test.pypi.org/simple', '--no-deps', '--only-binary=:all:', '--dest', downloaded, f'margin-mcp=={version}')
              wheel = next(downloaded.glob('*.whl'))
              assert hashlib.sha256(wheel.read_bytes()).digest() == hashlib.sha256(expected.read_bytes()).digest()
              run('install', '--no-deps', wheel)
              subprocess.run([str(python), '-I', str(smoke), '--expected-version', version, '--workbench'], check=True, cwd=root)

  pypi:
    needs: [build, install, staging-install]
    if: >-
      ${{ !cancelled() && inputs.publish && github.ref == 'refs/heads/main' &&
          needs.build.result == 'success' && needs.install.result == 'success' &&
          (!inputs.testpypi || needs.staging-install.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/margin-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  production-install:
    needs: pypi
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Verify production wheel and smoke from outside the checkout
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, tempfile, urllib.request, venv
          version = os.environ['RELEASE_VERSION']
          expected = pathlib.Path(f'dist/margin_mcp-{version}-py3-none-any.whl').resolve()
          smoke = pathlib.Path('scripts/check_installed_product.py').resolve()
          with urllib.request.urlopen(f'https://pypi.org/pypi/margin-mcp/{version}/json', timeout=30) as response:
              published = json.load(response)
          for artifact in pathlib.Path('dist').iterdir():
              record = next(item for item in published['urls'] if item['filename'] == artifact.name)
              assert record['digests']['sha256'] == hashlib.sha256(artifact.read_bytes()).hexdigest()
          with tempfile.TemporaryDirectory() as temp:
              root = pathlib.Path(temp)
              venv.EnvBuilder(with_pip=True).create(root / 'venv')
              python = root / 'venv/bin/python'
              def run(*args):
                  subprocess.run([str(python), '-m', 'pip', '--isolated', *map(str, args)], check=True, cwd=root)
              run('download', '--index-url', 'https://pypi.org/simple', '--no-deps', '--only-binary=:all:', '--dest', root, f'margin-mcp=={version}')
              wheel = next(root.glob('*.whl'))
              assert hashlib.sha256(wheel.read_bytes()).digest() == hashlib.sha256(expected.read_bytes()).digest()
              run('install', '--index-url', 'https://pypi.org/simple', wheel)
              subprocess.run([str(python), '-I', str(smoke), '--expected-version', version], check=True, cwd=root)
              run('install', '--index-url', 'https://pypi.org/simple', str(wheel) + '[workbench]')
              subprocess.run([str(python), '-I', str(smoke), '--expected-version', version, '--workbench'], check=True, cwd=root)
