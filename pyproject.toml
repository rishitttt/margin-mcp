[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "margin-research"
version = "0.1.0"
description = "Core Indian financial-research services and a local development workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "httpx2==2.13.1", "mcp==2.2.0", "jsonschema==4.26.0"]

[project.optional-dependencies]
workbench = ["fastapi==0.155.0", "uvicorn==0.53.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8", "playwright==1.64.0", "build==1.6.1"]

[project.scripts]
margin-workbench = "margin.interfaces.workbench.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"margin.resources" = ["*.json"]
"margin.interfaces.workbench" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
